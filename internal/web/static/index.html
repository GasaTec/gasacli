<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>GasaCLI · Seu estúdio</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/office-style.css" />
    <script type="module" src="/static/office-app.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">Ir para o conteúdo</a>
    <header class="topbar">
      <a class="brand" href="#/escritorio"
        ><img src="/static/mark-light.svg" alt="" /><strong
          >gasa<span>cli</span></strong
        ><span class="brand-caption">SEU ESTÚDIO DE IA</span></a
      ><label class="project-picker"
        ><span>ESCRITÓRIO</span
        ><select id="project" aria-label="Projeto ativo">
          <option value="">Carregando projetos…</option>
        </select></label
      ><span id="connection" class="connection" role="status">Conectando</span
      ><button id="notifications" class="quiet" aria-label="Abrir solicitações">
        ♧ <span id="notification-count">0</span></button
      ><button id="stop-team" class="stop">■ <span>Parar equipe</span></button>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <main id="page" tabindex="-1"></main>
    <nav class="dock" aria-label="Navegação principal">
      <a href="#/escritorio" data-nav="escritorio"><span>⌂</span>Escritório</a
      ><a href="#/equipe" data-nav="equipe"><span>♧</span>Equipe</a
      ><a href="#/tarefas" data-nav="tarefas"><span>▤</span>Tarefas</a
      ><a href="#/dashboard" data-nav="dashboard"><span>▥</span>Dashboard</a
      ><a href="#/ajustes/ferramentas" data-nav="ajustes"
        ><span>⚙</span>Ajustes</a
      >
    </nav>
    <dialog id="modal">
      <div id="modal-content"></div>
      <button
        id="close-modal"
        class="quiet modal-close"
        aria-label="Fechar painel"
      >
        ×
      </button>
    </dialog>
    <noscript
      >Ative JavaScript para abrir o escritório. Nenhum agente é iniciado ao
      abrir esta página.</noscript
    >
  </body>
</html>
