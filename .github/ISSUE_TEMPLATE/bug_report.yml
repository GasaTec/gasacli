name: Bug report
description: Report a reproducible GasaCLI defect (never include secrets)
title: "bug: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Redact private content and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node version and relevant CLI versions
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, private repository content and personal data.
