name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./cmd/gasa

  npm:
    name: npm checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Test npm package
        working-directory: npm
        run: npm test
      - name: Check npm package contents
        working-directory: npm
        run: npm pack --dry-run

  installers:
    name: Installer checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh npm/test/install-dir.test.sh
          sh -n scripts/install.sh
      - name: Run shellcheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/install.sh
      - name: Check Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File npm/test/install-dir.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File npm/test/install-dir.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          powershell -NoProfile -ExecutionPolicy Bypass -File npm/test/install-flow.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File npm/test/install-flow.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Error "PowerShell installer not found: $path"
            exit 1
          }

          $parseCommand = "`$tokens = `$null; `$parseErrors = `$null; [System.Management.Automation.Language.Parser]::ParseFile('$path', [ref]`$tokens, [ref]`$parseErrors) | Out-Null; if (`$parseErrors.Count -gt 0) { `$parseErrors | ForEach-Object { Write-Error `$_.Message }; exit 1 }"
          powershell -NoProfile -Command $parseCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -Command $parseCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $analysisErrors = Invoke-ScriptAnalyzer -Path $path -Severity Error
          if ($analysisErrors.Count -gt 0) {
            $analysisErrors | Format-List | Out-String | Write-Error
            exit 1
          }
