name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish packages for (for example v0.1.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  test:
    if: github.event_name == 'push'
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  packages:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Set package version from the tag
        working-directory: npm
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must look like v1.2.3: $TAG" >&2; exit 1 ;; esac
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Test package
        working-directory: npm
        run: npm test
      - name: Publish to npmjs.org
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npmjs.org (see docs/install.md)."; exit 0; fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          if npm view "gasacli@${TAG#v}" version >/dev/null 2>&1; then echo "gasacli@${TAG#v} already on npmjs.org"; exit 0; fi
          npm publish --access public --provenance
      - name: Publish to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@gasatec/gasacli publishConfig.registry=https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          if npm view "@gasatec/gasacli@${TAG#v}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then echo "already on GitHub Packages"; exit 0; fi
          npm publish
